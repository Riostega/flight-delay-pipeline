# Full build and test against Snowflake. Requires secrets; skips cleanly when
# they are absent so the workflow does not fail on a fork, or if the Snowflake
# trial expires and the secrets are removed.
#
# Models are built into a separate CI schema so a test run cannot disturb the
# production models. Sources are read from PUBLIC either way, and the dashboard
# smoke test then renders against the models this run just built in CI.
name: dbt build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Every run builds into the same CI schema and drops it at the end. Two runs at
# once (a merge to main and a PR push, say) would have one run's teardown drop
# the schema under the other, failing it for no reason in the code. One fixed
# group for all branches, and queued rather than cancelled.
concurrency:
  group: dbt-build-ci-schema
  cancel-in-progress: false

# Nothing here writes to the repo.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Are Snowflake secrets configured?
        id: check
        env:
          ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
        run: |
          if [ -n "$ACCOUNT" ]; then echo "ready=true" >> "$GITHUB_OUTPUT";
          else echo "ready=false" >> "$GITHUB_OUTPUT"; echo "No Snowflake secrets - skipping."; fi

      - uses: actions/setup-python@v5
        if: steps.check.outputs.ready == 'true'
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        if: steps.check.outputs.ready == 'true'
        run: pip install -r requirements.txt

      - name: Write dbt profile
        if: steps.check.outputs.ready == 'true'
        env:
          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
          SNOWFLAKE_PASSWORD: ${{ secrets.SNOWFLAKE_PASSWORD }}
          SNOWFLAKE_DATABASE: ${{ secrets.SNOWFLAKE_DATABASE }}
          SNOWFLAKE_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
        run: |
          mkdir -p ~/.dbt
          # Quoted heredoc, and dbt resolves the values itself via env_var().
          # Interpolating secrets into YAML is unsafe: a value starting with
          # * or & is a YAML anchor (parse error, or a silent null), one
          # containing ': ' fails to parse, an all-digit password becomes an
          # int rather than a str, and trailing whitespace is stripped. Several
          # of those fail SILENTLY, so a password rotation could break CI with
          # an authentication error and no indication why.
          cat > ~/.dbt/profiles.yml <<'EOF'
          flight_delay_pipeline:
            target: ci
            outputs:
              ci:
                type: snowflake
                account: "{{ env_var('SNOWFLAKE_ACCOUNT') }}"
                user: "{{ env_var('SNOWFLAKE_USER') }}"
                password: "{{ env_var('SNOWFLAKE_PASSWORD') }}"
                role: ACCOUNTADMIN
                database: "{{ env_var('SNOWFLAKE_DATABASE') }}"
                warehouse: "{{ env_var('SNOWFLAKE_WAREHOUSE') }}"
                schema: CI
                threads: 1
          EOF

      - name: dbt build
        if: steps.check.outputs.ready == 'true'
        working-directory: dbt
        env:
          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
          SNOWFLAKE_PASSWORD: ${{ secrets.SNOWFLAKE_PASSWORD }}
          SNOWFLAKE_DATABASE: ${{ secrets.SNOWFLAKE_DATABASE }}
          SNOWFLAKE_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
        run: dbt build

      - name: Dashboard renders
        # compileall proves the file parses; this proves it actually runs
        # against real data. It reads the models this run just built in CI, not
        # production's PUBLIC copies, so a PR that renames a column the
        # dashboard uses fails here, before merge. Only the raw VARIANT tables,
        # which dbt never builds, are read from PUBLIC. Must stay before the
        # step that drops the CI schema.
        if: steps.check.outputs.ready == 'true'
        env:
          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
          SNOWFLAKE_PASSWORD: ${{ secrets.SNOWFLAKE_PASSWORD }}
          SNOWFLAKE_DATABASE: ${{ secrets.SNOWFLAKE_DATABASE }}
          SNOWFLAKE_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
          SNOWFLAKE_SCHEMA: CI
          SNOWFLAKE_RAW_SCHEMA: PUBLIC
        run: python dashboard/smoke_test.py

      - name: Drop the CI schema
        # Always runs, so a failed build does not leave objects behind.
        if: always() && steps.check.outputs.ready == 'true'
        working-directory: dbt
        env:
          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
          SNOWFLAKE_PASSWORD: ${{ secrets.SNOWFLAKE_PASSWORD }}
          SNOWFLAKE_DATABASE: ${{ secrets.SNOWFLAKE_DATABASE }}
          SNOWFLAKE_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
        run: dbt run-operation drop_ci_schema || true
