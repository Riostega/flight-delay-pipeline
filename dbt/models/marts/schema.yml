version: 2

models:
  - name: fct_flight_events
    description: >
      One row per physical flight per scheduled departure, for airports in
      dim_airports. Collapses codeshare marketing labels and re-pull duplicates
      onto the operating flight, so carrier-level delay statistics reflect the
      airline that actually flew the aircraft rather than every airline that
      sold a seat on it.

      Time semantics: *_scheduled_* are published gate times, *_actual_* are
      runway times (wheels-off / wheels-on), because the source fills "actual"
      with its runway reading. Delays therefore compare a runway time with a
      gate time. The source also never returns an arrival more than about 56
      minutes late, so late rates are lower bounds.
    columns:
      - name: flight_event_key
        description: >
          Operating flight designator plus scheduled departure, in local time
          (formatted YYYY-MM-DD HH24:MI:SS.FF3). The grain key. Local rather than
          UTC because a small number of records omit the timezone, which would
          leave a UTC key null.
        tests: [unique, not_null]

      - name: flight_date
        description: Flight date as reported by the source.

      - name: operating_flight_iata
        description: >
          Flight designator of the carrier that actually operated the aircraft.
          Taken from the codeshare block when present, otherwise the record's own
          designator, falling back to ICAO for private operators with no IATA code.
        tests: [not_null]
      - name: operating_carrier_code
        description: >
          Code of the airline that actually operated the flight: the two-letter
          IATA code, or the three-letter ICAO code for operators without one.
          Use this as the carrier identity. It separates regional operators
          (Republic YX, SkyWest OO, Envoy MQ) from the mainline brands they fly
          for, and merges livery variants that split the name.
        tests: [not_null]
      - name: operating_carrier_name
        description: >
          Brand the operating flight is sold under, title-cased, as the source
          reports it. Not necessarily the operator: AviationStack reports the
          mainline parent for regional flights (SkyWest is named American,
          United, Delta or Alaska), and livery variants such as "Alaska Airlines
          (Oneworld Livery)" appear as separate names. 'Unknown' where the
          source sends its 'empty' placeholder. For the actual operator use
          operating_carrier_code.
        tests: [not_null]
      - name: marketing_flight_iata
        description: >
          One of the marketing labels seen for this flight, the alphabetically
          first. A representative label, not the main seller, and not
          necessarily the operator's own. Use operating_* for attribution.
      - name: marketing_carrier_name
        description: >
          Carrier of that representative label, with the same caveat. 'Unknown'
          where the source sends its 'empty' placeholder.
      - name: marketing_label_count
        description: >
          Distinct marketing flight numbers observed for this physical flight in
          the sampled pulls. Greater than one means several carriers sold seats
          on the same aircraft.
        tests: [not_null]
      - name: has_codeshare_partners
        description: >
          Whether more than one marketing label was seen for this flight. False
          does NOT mean the flight is not a codeshare: a single observed label
          can belong to another carrier (marketing_flight_iata differs from
          operating_flight_iata), which happens for several hundred flights.
      - name: aircraft_icao24
        description: Transponder identifier of the airframe. Useful for confirming that codeshare siblings are one aircraft.

      - name: departure_airport
        description: IATA code of the origin airport. Unbounded — flights arrive from anywhere.
      - name: arrival_airport
        description: IATA code of the arrival airport. Constrained to the airports in scope.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_airports')
                field: iata_code
      - name: departure_timezone
        description: IANA zone of the origin airport, as reported alongside the timestamps.
      - name: arrival_timezone
        description: IANA zone of the arrival airport.

      - name: departure_scheduled_local
        description: >
          Scheduled departure as the source reports it — local wall time at the
          airport. Always present, and what the grain key is built on.
        tests: [not_null]
      - name: departure_actual_local
        description: Actual departure (wheels-off, a runway time), local wall time.
      - name: departure_scheduled_utc
        description: >
          Scheduled departure in true UTC. Null when the source omits the origin
          timezone, or when the local time falls in an hour a daylight-saving
          change repeats or skips (see has_dst_ambiguous_time).
      - name: departure_actual_utc
        description: Actual departure (wheels-off) in true UTC. Null in the same cases.
      - name: departure_delay_minutes
        description: >
          Wheels-off minus scheduled gate departure, in minutes. Positive is
          late, negative early. Includes the whole taxi-out, so it runs well
          above a gate departure delay. Computed in UTC where the zone is known,
          otherwise in local time; not read from the source's delay field.

      - name: arrival_scheduled_local
        description: Scheduled arrival, local wall time at the arrival airport.
      - name: arrival_actual_local
        description: Actual arrival (wheels-on, a runway time), local wall time.
      - name: arrival_scheduled_utc
        description: >
          Scheduled arrival in true UTC. Null when the local time falls in an
          hour a daylight-saving change repeats or skips.
      - name: arrival_actual_utc
        description: >
          Actual arrival (wheels-on) in true UTC, converted using the timezone
          the source reports separately. What the weather join matches on. Null
          in the same daylight-saving cases, so such a flight gets no weather.
      - name: arrival_delay_minutes
        description: >
          Wheels-on minus scheduled gate arrival, in minutes. Leaves out
          taxi-in, so it reads a few minutes earlier than gate arrival. The
          source never returns an arrival more than about 56 minutes late (the
          limit is in the raw payload, not this model), so the late tail is
          missing and averages and late rates are lower bounds.

      - name: minutes_recovered
        description: >
          Departure delay minus arrival delay, which equals scheduled
          gate-to-gate time minus actual runway-to-runway time. It includes
          taxi-out and taxi-in as well as any schedule padding, so it is NOT time
          made up in the air; treat it as an upper bound on padding.
      - name: is_delayed_departure
        description: >
          Wheels-off 15 or more minutes after the scheduled gate departure.
          Includes taxi-out, so most flights qualify; not a lateness measure and
          not comparable to BTS departure delay.
        tests: [not_null]
      - name: is_delayed_arrival
        description: >
          Wheels-on 15 or more minutes after the scheduled gate arrival. Uses the
          US DOT / BTS threshold (exactly 15 counts as late), but BTS measures
          gate arrival, which is later by the taxi-in time. So this rate is lower
          than a BTS delay rate for the same flights, and not directly
          comparable to published figures; compare with BTS WheelsOn minus
          CRSArrTime instead. Also right-censored, see arrival_delay_minutes.
        tests: [not_null]

      - name: source_departure_delay_minutes
        description: >
          The delay the source reports for departure, kept for reference only.
          Not an independent check: it often holds the arrival delay instead of
          the departure delay.

      - name: source_arrival_delay_minutes
        description: >
          The delay the source reports for arrival, kept for reference only.
          Floored at 0, so it disagrees with the computed value for every early
          arrival.

      - name: has_suspect_times
        description: >
          True when the times on a record cannot be trusted as a pair. Three
          causes: (a) a schedule from a different leg or day; (b) the source
          re-timing the arrival schedule to the actual landing after a long
          departure delay, which is most flagged rows; (c) a local time in an
          hour a daylight-saving change repeats or skips. Rules: a departure
          more than three hours early, arrival delay minus departure delay
          (equivalently, flown duration minus scheduled duration) more than four
          hours, or has_dst_ambiguous_time. Source defects rather than pipeline
          faults, so flagged rather than dropped; assert_suspect_time_rate fails
          if they stop being rare.
        tests: [not_null]
      - name: has_retimed_arrival_schedule
        description: >
          Heuristic for the milder form of cause (b) above: departed 60 or more
          minutes late yet arrived within one minute of schedule, the signature
          of the source moving arrival.scheduled onto the landing. Mostly cargo
          and business-jet operators, where arrival delay is unreliable. It also
          catches the odd genuine flight that recovered an hour, so treat it as
          a sensitivity filter. Not part of has_suspect_times.
        tests: [not_null]
      - name: has_dst_ambiguous_time
        description: >
          True when any of the four local times falls in the hour a
          daylight-saving change repeats (US: 01:00-01:59 on the first Sunday of
          November) or skips (02:00-02:59 on the second Sunday of March). The
          feed has no UTC offset, so the true instant is unknowable: its *_utc
          value is null and any delay using it may be off by an hour. Included
          in has_suspect_times.
        tests: [not_null]

      - name: weather_observed_at
        description: >
          Timestamp of the matched weather observation, in UTC. This is the
          station's observation time, not the moment the pipeline fetched it.
      - name: weather_lag_minutes
        description: >
          Minutes between the matched observation and actual arrival. Retained on
          every row, including rows whose observation was too stale to use, so
          match quality stays inspectable rather than assumed.
      - name: has_weather_match
        description: >
          True when an observation was found within weather_max_lag_minutes
          (set under vars in dbt_project.yml) before arrival. False means every
          weather_* column is null.
        tests: [not_null]
      - name: weather_main
        description: >
          Condition category at the arrival airport around landing. Null when no
          observation was fresh enough; a stale reading is discarded rather than
          presented as current.
      - name: weather_description
        description: Longer-form condition text from the same observation.
      - name: weather_temp_f
        description: Temperature in Fahrenheit at the arrival airport.
      - name: weather_humidity
        description: Relative humidity, percent.
      - name: weather_wind_speed
        description: Wind speed, miles per hour.
      - name: weather_wind_gust
        description: Gust speed, miles per hour. Null when the station reports no gusts.
      - name: weather_visibility_m
        description: Visibility in metres, capped by the provider at 10000.
      - name: weather_cloud_cover_pct
        description: Cloud cover, percent.

seeds:
  - name: dim_airports
    description: >
      Airports in scope, with coordinates. Read by dbt as a dimension and by
      pipeline/extract_pipeline.py as the extraction scope, so the pipeline and
      the warehouse cannot disagree about which airports are tracked.
    columns:
      - name: iata_code
        description: Three-letter IATA code. The airport's identity throughout the project.
        tests: [unique, not_null]
      - name: airport_name
        description: Full airport name.
      - name: city
        description: City served.
      - name: latitude
        description: Latitude used for the weather request.
        tests: [not_null]
      - name: longitude
        description: Longitude used for the weather request.
        tests: [not_null]
